name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # engines.node floor, pinned explicitly since setup-node would resolve the >=22.16 range to the newest release
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test:unit
      - name: Rehearsal fixtures
        run: pnpm test:rehearse
      - name: End-to-end replays
        run: pnpm test:e2e
      - name: Upload e2e findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-findings
          path: .doug/.state/e2e/findings.json
          include-hidden-files: true
          if-no-files-found: warn
